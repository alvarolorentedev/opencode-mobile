name: iOS Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v1.0.51). Leave blank for the latest v* tag.'
        required: false
        default: ''
        type: string
      upload_to_store:
        description: Upload the built IPA to App Store Connect after building
        required: false
        default: false
        type: boolean

# Manual release pipeline. Builds an explicit tag when given, otherwise the
# latest `v*` tag; never the ref it was dispatched from. Never runs on push or
# tag, and serializes releases so a build is never killed mid-upload.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # ponytail: same steps as build.yml / pr-validate.yml validate; extract to a reusable workflow if they drift
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release-tag.outputs.tag }}
      ref: ${{ steps.release-tag.outputs.ref }}

    steps:
      # Build the requested tag, or the latest release tag when none is given;
      # never the (possibly stale) ref the workflow was dispatched from.
      - name: Resolve release tag
        id: release-tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          REMOTE="https://github.com/${{ github.repository }}.git"
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG=$(git ls-remote --tags --refs "$REMOTE" 'refs/tags/v*' \
              | awk -F/ '{print $NF}' | sort -V | tail -1)
          fi
          if [ -z "$TAG" ]; then
            echo "::error::No release tag found"
            exit 1
          fi
          if ! git ls-remote --tags --refs "$REMOTE" "refs/tags/$TAG" | grep -q .; then
            echo "::error::Tag $TAG does not exist"
            exit 1
          fi
          echo "Building release tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ref=refs/tags/$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.latest-tag.outputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and typecheck
        run: npm run test:ci:static

      - name: Validate fake server harness
        run: npm run test:fake-server:self

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run CI flow suite against fake OpenCode server
        run: npm run test:e2e:web
        env:
          CI: 'true'
          EXPO_PUBLIC_E2E_MODE: '1'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          retention-days: 3
          path: playwright-report
          if-no-files-found: ignore

  ios-release:
    needs: validate
    runs-on: macos-26
    permissions:
      contents: write

    env:
      EXPO_APP_VARIANT: production
      IOS_BUNDLE_IDENTIFIER: app.getopencode.mobile
      EXPO_IOS_APP_STORE_ID: ${{ vars.EXPO_IOS_APP_STORE_ID }}
      EXPO_IOS_APP_STORE_COUNTRY: ${{ vars.EXPO_IOS_APP_STORE_COUNTRY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release version
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          APP_VERSION=$(npx expo config --type public --json | python3 -c "import sys,json; print(json.load(sys.stdin)['version'])")
          if [ "$APP_VERSION" != "${TAG#v}" ]; then
            echo "Tag $TAG does not match app version $APP_VERSION"
            exit 1
          fi

      - name: Validate signing secrets
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          : "${APPLE_CERTIFICATE_BASE64:?Missing required secret: APPLE_CERTIFICATE_BASE64}"
          : "${APPLE_CERTIFICATE_PASSWORD:?Missing required secret: APPLE_CERTIFICATE_PASSWORD}"
          : "${APPLE_PROVISIONING_PROFILE_BASE64:?Missing required secret: APPLE_PROVISIONING_PROFILE_BASE64}"
          : "${APPLE_TEAM_ID:?Missing required secret: APPLE_TEAM_ID}"

      - name: Generate iOS native project
        run: CI=1 npx expo prebuild --platform ios --clean

      - name: Detect workspace
        id: workspace
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" -print -quit)
          if [ -z "$WORKSPACE" ]; then
            echo "No .xcworkspace found"
            exit 1
          fi
          echo "path=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$WORKSPACE" .xcworkspace)" >> "$GITHUB_OUTPUT"

      - name: Create temporary keychain
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

      - name: Import distribution certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | tr -d '[:space:]' | base64 -D > "$CERT_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          PROFILE_PLIST=$RUNNER_TEMP/profile.plist
          printf '%s' "$APPLE_PROVISIONING_PROFILE_BASE64" | tr -d '[:space:]' | base64 -D > "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(plutil -extract UUID raw "$PROFILE_PLIST")
          PROFILE_NAME=$(plutil -extract Name raw "$PROFILE_PLIST")
          PROFILE_TEAM_ID=$(plutil -extract TeamIdentifier.0 raw "$PROFILE_PLIST")
          PROFILE_APP_IDENTIFIER=$(plutil -extract Entitlements.application-identifier raw "$PROFILE_PLIST")
          if [ "$PROFILE_TEAM_ID" != "$APPLE_TEAM_ID" ] || [ "${PROFILE_APP_IDENTIFIER#*.}" != "$IOS_BUNDLE_IDENTIFIER" ]; then
            echo "Provisioning profile does not match team $APPLE_TEAM_ID and bundle $IOS_BUNDLE_IDENTIFIER"
            exit 1
          fi
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID".mobileprovision
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Build archive
        run: |
          xcodebuild -workspace "${{ steps.workspace.outputs.path }}" \
            -scheme "${{ steps.workspace.outputs.name }}" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/build.xcarchive" \
            -destination "generic/platform=iOS" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}.${{ github.run_attempt }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            archive

      - name: Verify archive
        run: |
          if [ ! -d "$RUNNER_TEMP/build.xcarchive" ]; then
            echo "Archive not found"
            exit 1
          fi

      - name: Export IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$IOS_BUNDLE_IDENTIFIER</key>
              <string>$PROFILE_NAME</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/build.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/ios-build"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-ipa
          retention-days: 3
          path: ${{ runner.temp }}/ios-build/*.ipa
          if-no-files-found: error

      - name: Rename IPA for release
        run: cp "$RUNNER_TEMP/ios-build/"*.ipa opencode-mobile.ipa

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          files: opencode-mobile.ipa

      - name: Upload to App Store Connect
        if: ${{ inputs.upload_to_store }}
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          if [ -z "$APPSTORE_API_KEY_ID" ] || [ -z "$APPSTORE_API_ISSUER_ID" ] || [ -z "$APPSTORE_API_PRIVATE_KEY" ]; then
            echo "Missing App Store Connect API key secret"
            exit 1
          fi
          IPA_FILE=$(find "$RUNNER_TEMP/ios-build" -name "*.ipa" | head -1)
          if [ -z "$IPA_FILE" ]; then
            echo "No IPA file found"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/private_keys"
          cat > "$RUNNER_TEMP/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8" << EOF
          $APPSTORE_API_PRIVATE_KEY
          EOF
          chmod 600 "$RUNNER_TEMP/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8"

          cd "$RUNNER_TEMP"
          xcrun altool --upload-app \
              --type ios \
              --file "$IPA_FILE" \
              --apiKey "$APPSTORE_API_KEY_ID" \
              --apiIssuer "$APPSTORE_API_ISSUER_ID"

      - name: Cleanup keychain
        if: always()
        run: |
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi

name: Android cache warm

# Release tags can only restore caches written for the default branch, so this
# scheduled build keeps the Gradle cache in release.yml warm. The artifacts are
# discarded; only the Gradle state is kept. The Expo template signs release
# builds with the generated debug keystore, so no release secrets are needed.
on:
  schedule:
    # Twice a week: GitHub evicts cache entries that go unused for 7 days.
    - cron: '0 4 * * 1,4'
  workflow_dispatch:

concurrency:
  group: android-cache-warm
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: 'true'
  EXPO_NO_TELEMETRY: '1'
  EXPO_APP_VARIANT: production

jobs:
  android:
    name: android
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Android release toolchain
        uses: ./.github/actions/setup-android-release

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean

      # Same task set as scripts/build-android-release.mjs so the release job
      # restores matching task outputs.
      - name: Warm Gradle cache
        working-directory: android
        run: ./gradlew bundleRelease assembleRelease -PreactNativeArchitectures=arm64-v8a

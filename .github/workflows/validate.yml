name: Validate

# Single source of truth for the pre-release gate. Called by pr-validate.yml,
# build.yml, and ios-release.yml so the checks cannot drift apart.
on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to validate. Defaults to the caller workflow ref.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and typecheck
        run: npm run test:ci:static

      - name: Validate fake server harness
        run: npm run test:fake-server:self

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run CI flow suite against fake OpenCode server
        run: npm run test:e2e:web
        env:
          CI: 'true'
          EXPO_PUBLIC_E2E_MODE: '1'

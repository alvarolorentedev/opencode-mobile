name: Validate

# Single source of truth for the pre-release gate. Called by pr-validate.yml,
# build.yml, and ios-release.yml so the checks cannot drift apart.
#
# Static checks and the fake-server self-test run in one job. E2E runs in one
# job with one web export and four Playwright workers; each worker owns a fake
# V1/V2 server pair, so the fake server's global scenario stays isolated.
on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to validate. Defaults to the caller workflow ref.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ESLint and incremental TypeScript caches only save time; a stale entry
      # is revalidated against file content by the tools themselves.
      - name: Cache static-check state
        uses: actions/cache@v4
        with:
          path: |
            .eslintcache
            tsconfig.app.tsbuildinfo
            tsconfig.tests.tsbuildinfo
          key: static-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.*', 'tsconfig*.json') }}-${{ github.sha }}
          restore-keys: |
            static-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.*', 'tsconfig*.json') }}-

      - name: Lint and typecheck
        run: npm run test:ci:static

      - name: Validate fake server harness
        run: npm run test:fake-server:self

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      E2E_WORKERS: '4'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The browser download is the slowest and least predictable part of the
      # gate. Cache the binary; fall back to the full dependency install when
      # the cache is cold.
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Run CI flow suite against fake OpenCode server
        run: npx playwright test
        env:
          CI: 'true'
          EXPO_PUBLIC_E2E_MODE: '1'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 3

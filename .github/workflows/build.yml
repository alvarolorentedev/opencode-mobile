name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_validate:
        description: 'Run the full gate (emergency override)'
        required: false
        default: true
        type: boolean

# A new push cancels the previous in-progress run on the same ref, so stale
# validations don't race current ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Validation only. Releases are built by release.yml once a green main run
  # exists for the tagged commit, so a tag push can never race this gate.
  validate:
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read
    with:
      force_full: ${{ github.event_name == 'workflow_dispatch' && inputs.force_validate }}

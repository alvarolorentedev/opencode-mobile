name: Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

# A new push cancels the previous in-progress run on the same ref, so stale
# builds don't race current ones. Tag releases are exempt: a release in
# flight must never be killed mid-upload.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and typecheck
        run: npm run test:ci:static

      - name: Validate fake server harness
        run: npm run test:fake-server:self

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run CI flow suite against fake OpenCode server
        run: npm run test:e2e:web
        env:
          CI: 'true'
          EXPO_PUBLIC_E2E_MODE: '1'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          retention-days: 3
          path: playwright-report
          if-no-files-found: ignore

  android-release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      EXPO_APP_VARIANT: production
      EXPO_ANDROID_PACKAGE: ${{ vars.EXPO_ANDROID_PACKAGE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/gradle-wrapper.properties','**/build.gradle*','**/settings.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm ci

      - name: Decode keystore & verify
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -eo pipefail
          # Compute secret length robustly and without adding newlines
          SECRET_LEN=$(printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | wc -c)
          echo "Secret length: $SECRET_LEN"
          if [ "$SECRET_LEN" -lt 100 ]; then
            echo "Keystore secret is unexpectedly short; refusing to continue."
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          # Decode safely using printf to avoid echo interpretation issues
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE_PATH"
          FILE_SIZE=$(stat -c%s "$KEYSTORE_PATH")
          echo "Decoded size: $FILE_SIZE"
          if [ "$FILE_SIZE" -lt 100 ]; then
            echo "Decoded keystore is unexpectedly small; refusing to continue."
            exit 1
          fi
          echo "Keystore on disk:"
          sha256sum "$KEYSTORE_PATH" || true
          ls -l "$KEYSTORE_PATH" || true
        shell: bash

      - name: Build Android release
        run: npm run build:android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Version tags ship a Play-ready AAB (32-bit + 64-bit ARM); other builds
          # (main, manual) only need 64-bit ARM, which is faster and lighter.
          ANDROID_RELEASE_ABIS: ${{ startsWith(github.ref, 'refs/tags/v') && 'armeabi-v7a,arm64-v8a' || 'arm64-v8a' }}

      - name: Verify APK signature
        run: |
          set -eo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner -type f | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found in Android SDK"
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "$APK"
        shell: bash

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-artifacts
          retention-days: 3
          path: android/app/build/outputs/**/*.apk

      - name: Rename APK for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp android/app/build/outputs/apk/release/app-release.apk opencode-mobile.apk

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: opencode-mobile.apk

      - name: Upload to Play Store (internal)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ vars.EXPO_ANDROID_PACKAGE }}
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed

  foss-release:
    needs: [validate, android-release]
    if: ${{ always() && needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      OPENCODE_BUILD_FLAVOR: foss
      EXPO_PUBLIC_FOSS: '1'
      EXPO_ANDROID_PACKAGE: app.getopencode.fdroid

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-foss-${{ runner.os }}-${{ hashFiles('**/gradle-wrapper.properties','**/build.gradle*','**/settings.gradle*') }}
          restore-keys: gradle-foss-${{ runner.os }}-

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm ci

      - name: Validate FOSS dependency preparation
        run: npm run test:foss

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -eo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE_PATH"
          test "$(stat -c%s "$KEYSTORE_PATH")" -ge 100
          echo "Keystore on disk:"
          sha256sum "$KEYSTORE_PATH" || true
        shell: bash

      # Builds the de-Googled FOSS flavor: no Play Billing (expo-iap), no ML Kit
      # barcode scanner (expo-camera), and expo-notifications compiled against
      # F-Droid's firebase-stubs instead of firebase-messaging.
      - name: Build FOSS Android release
        run: npm run build:foss:android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verify APK signature
        run: |
          set -eo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner -type f | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found in Android SDK"
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "$APK"
        shell: bash

      - name: Verify the FOSS APK has no proprietary Google libraries
        run: |
          set -eo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          # expo-notifications still compiles against firebase-stub classes, so
          # com.google.firebase.* is expected; check the libraries we removed.
          for needle in \
            'com/android/billingclient' \
            'com/google/mlkit' \
            'com/android/installreferrer' \
            'play-services-code-scanner'; do
            if unzip -p "$APK" 'classes*.dex' | grep -a -q -F "$needle"; then
              echo "::error::FOSS APK unexpectedly contains: $needle"
              exit 1
            fi
          done
          echo "FOSS APK clean of the removed proprietary Google libraries."
        shell: bash

      - name: Rename APK for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp android/app/build/outputs/apk/release/app-release.apk opencode-mobile-fdroid.apk

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: opencode-mobile-fdroid.apk

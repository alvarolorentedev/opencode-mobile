name: Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_android:
        description: 'Also build the Android release APKs (skipped on main pushes)'
        required: false
        default: false
        type: boolean
      share_apk_run:
        description: 'Validate an existing release APK artifact from this workflow run ID without rebuilding'
        required: false
        default: ''
        type: string
      force_validate:
        description: 'Emergency override: run full validation even for a release tag'
        required: false
        default: false
        type: boolean

# A new push cancels the previous in-progress run on the same ref, so stale
# builds don't race current ones. Tag releases are exempt: a release in
# flight must never be killed mid-upload.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.share_apk_run || 'build' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  validate:
    # Tags reuse the exact-SHA validation from main. The emergency override
    # reruns the complete gate when a release must not depend on history.
    if: ${{ !startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.force_validate) }}
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read
    with:
      force_full: ${{ github.event_name == 'workflow_dispatch' && inputs.force_validate }}

  assert-validated:
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !(github.event_name == 'workflow_dispatch' && inputs.force_validate) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require a successful full validation for this SHA
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ github.sha }}
        run: node scripts/ci/assert-validated.mjs

  # One job normalizes the tag/main-dispatch conditions for both release
  # builds. It also creates the GitHub Release once before the parallel APK
  # uploads, avoiding a create race between them.
  release-gate:
    needs: [validate, assert-validated]
    if: ${{ always() && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.build_android)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Verify the validation gate
        env:
          VALIDATE: ${{ needs.validate.result }}
          ASSERT_VALIDATED: ${{ needs.assert-validated.result }}
        run: |
          echo "validate=$VALIDATE assert-validated=$ASSERT_VALIDATED"
          test "$VALIDATE" = "success" || test "$ASSERT_VALIDATED" = "success"

      - name: Ensure the GitHub Release exists
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes

  # Release builds only run for `v*` tags or a manual dispatch that asks for
  # an APK; plain pushes to `main` stop at the validation gate.
  android-release:
    needs: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    env:
      EXPO_APP_VARIANT: production
      EXPO_ANDROID_PACKAGE: ${{ vars.EXPO_ANDROID_PACKAGE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/gradle-wrapper.properties','**/build.gradle*','**/settings.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # AGP's on-demand SDK installs occasionally fetch a truncated archive
      # and fail mid-build ("Archive is not a ZIP archive"). Pre-install them
      # with retries so a flaky download cannot abort Gradle.
      - name: Install CMake and NDK
        run: |
          set -eo pipefail
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK_ROOT" ]; then
            echo "::error::ANDROID_HOME and ANDROID_SDK_ROOT are both unset"
            exit 1
          fi
          for pkg in 'cmake;3.22.1' 'ndk;27.1.12297006'; do
            case "$pkg" in
              'cmake;3.22.1') [ -x "$SDK_ROOT/cmake/3.22.1/bin/cmake" ] && continue ;;
              'ndk;27.1.12297006') [ -d "$SDK_ROOT/ndk/27.1.12297006" ] && continue ;;
            esac
            for attempt in 1 2 3 4 5; do
              # Pin the install root so sdkmanager and Gradle cannot pick
              # different SDK directories on the same runner.
              if sdkmanager --sdk_root="$SDK_ROOT" --install "$pkg" </dev/null; then
                break
              fi
              rm -rf "$SDK_ROOT/.temp"
              # A failed unzip can leave a broken package directory behind
              # that blocks the next attempt, so drop it before retrying.
              case "$pkg" in
                ndk\;*) rm -rf "$SDK_ROOT/ndk/27.1.12297006" ;;
                cmake\;*) rm -rf "$SDK_ROOT/cmake/3.22.1" ;;
              esac
              if [ "$attempt" -eq 5 ]; then
                echo "::error::Failed to install $pkg after 5 attempts"
                exit 1
              fi
              sleep $((attempt * 5))
            done
          done
        shell: bash

      - name: Install dependencies
        run: npm ci

      - name: Decode keystore & verify
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -eo pipefail
          # Compute secret length robustly and without adding newlines
          SECRET_LEN=$(printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | wc -c)
          echo "Secret length: $SECRET_LEN"
          if [ "$SECRET_LEN" -lt 100 ]; then
            echo "Keystore secret is unexpectedly short; refusing to continue."
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          # Decode safely using printf to avoid echo interpretation issues
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE_PATH"
          FILE_SIZE=$(stat -c%s "$KEYSTORE_PATH")
          echo "Decoded size: $FILE_SIZE"
          if [ "$FILE_SIZE" -lt 100 ]; then
            echo "Decoded keystore is unexpectedly small; refusing to continue."
            exit 1
          fi
          echo "Keystore on disk:"
          sha256sum "$KEYSTORE_PATH" || true
          ls -l "$KEYSTORE_PATH" || true
        shell: bash

      - name: Build Android release
        run: npm run build:android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Version tags ship a Play-ready AAB (32-bit + 64-bit ARM); other builds
          # Manual builds include x86_64 so the same release APK runs on the emulator.
          ANDROID_RELEASE_ABIS: ${{ startsWith(github.ref, 'refs/tags/v') && 'armeabi-v7a,arm64-v8a' || 'arm64-v8a,x86_64' }}

      - name: Verify APK signature
        run: |
          set -eo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER=""
          for root in "$ANDROID_HOME" "$ANDROID_SDK_ROOT"; do
            [ -n "$root" ] && [ -d "$root/build-tools" ] || continue
            CANDIDATE=$(find "$root/build-tools" -name apksigner -type f | sort -V | tail -1)
            if [ -n "$CANDIDATE" ]; then APKSIGNER="$CANDIDATE"; break; fi
          done
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found in Android SDK (ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT)"
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "$APK"
        shell: bash

      - name: Rename APK for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp android/app/build/outputs/apk/release/app-release.apk opencode-mobile.apk

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: opencode-mobile.apk

      - name: Upload to Play Store (internal)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ vars.EXPO_ANDROID_PACKAGE }}
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed

  foss-release:
    needs: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    env:
      OPENCODE_BUILD_FLAVOR: foss
      EXPO_PUBLIC_FOSS: '1'
      EXPO_ANDROID_PACKAGE: app.getopencode.fdroid

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-foss-${{ runner.os }}-${{ hashFiles('**/gradle-wrapper.properties','**/build.gradle*','**/settings.gradle*') }}
          restore-keys: gradle-foss-${{ runner.os }}-

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # Same retried pre-install as android-release: protects the FOSS build
      # from the flaky AGP-downloaded CMake/NDK archives.
      - name: Install CMake and NDK
        run: |
          set -eo pipefail
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK_ROOT" ]; then
            echo "::error::ANDROID_HOME and ANDROID_SDK_ROOT are both unset"
            exit 1
          fi
          for pkg in 'cmake;3.22.1' 'ndk;27.1.12297006'; do
            case "$pkg" in
              'cmake;3.22.1') [ -x "$SDK_ROOT/cmake/3.22.1/bin/cmake" ] && continue ;;
              'ndk;27.1.12297006') [ -d "$SDK_ROOT/ndk/27.1.12297006" ] && continue ;;
            esac
            for attempt in 1 2 3 4 5; do
              # Pin the install root so sdkmanager and Gradle cannot pick
              # different SDK directories on the same runner.
              if sdkmanager --sdk_root="$SDK_ROOT" --install "$pkg" </dev/null; then
                break
              fi
              rm -rf "$SDK_ROOT/.temp"
              # A failed unzip can leave a broken package directory behind
              # that blocks the next attempt, so drop it before retrying.
              case "$pkg" in
                ndk\;*) rm -rf "$SDK_ROOT/ndk/27.1.12297006" ;;
                cmake\;*) rm -rf "$SDK_ROOT/cmake/3.22.1" ;;
              esac
              if [ "$attempt" -eq 5 ]; then
                echo "::error::Failed to install $pkg after 5 attempts"
                exit 1
              fi
              sleep $((attempt * 5))
            done
          done
        shell: bash

      - name: Install dependencies
        run: npm ci

      - name: Validate FOSS dependency preparation
        run: npm run test:foss

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -eo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE_PATH"
          test "$(stat -c%s "$KEYSTORE_PATH")" -ge 100
          echo "Keystore on disk:"
          sha256sum "$KEYSTORE_PATH" || true
        shell: bash

      # Builds the de-Googled FOSS flavor: no Play Billing (expo-iap), no ML Kit
      # barcode scanner (expo-camera), and expo-notifications compiled against
      # F-Droid's firebase-stubs instead of firebase-messaging.
      - name: Build FOSS Android release
        run: npm run build:foss:android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verify APK signature
        run: |
          set -eo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER=""
          for root in "$ANDROID_HOME" "$ANDROID_SDK_ROOT"; do
            [ -n "$root" ] && [ -d "$root/build-tools" ] || continue
            CANDIDATE=$(find "$root/build-tools" -name apksigner -type f | sort -V | tail -1)
            if [ -n "$CANDIDATE" ]; then APKSIGNER="$CANDIDATE"; break; fi
          done
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found in Android SDK (ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT)"
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "$APK"
        shell: bash

      - name: Verify the FOSS APK has no proprietary Google libraries
        run: |
          set -eo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          # expo-notifications still compiles against firebase-stub classes, so
          # com.google.firebase.* is expected; check the libraries we removed.
          for needle in \
            'com/android/billingclient' \
            'com/google/mlkit' \
            'com/android/installreferrer' \
            'play-services-code-scanner'; do
            if unzip -p "$APK" 'classes*.dex' | grep -a -q -F "$needle"; then
              echo "::error::FOSS APK unexpectedly contains: $needle"
              exit 1
            fi
          done
          echo "FOSS APK clean of the removed proprietary Google libraries."
        shell: bash

      - name: Rename APK for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp android/app/build/outputs/apk/release/app-release.apk opencode-mobile-fdroid.apk

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: opencode-mobile-fdroid.apk

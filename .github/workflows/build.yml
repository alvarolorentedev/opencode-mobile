name: Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target:
        description: Optional release to build (validation jobs always run)
        required: false
        default: none
        type: choice
        options:
          - none
          - android-release
          - ios-release
      upload_to_store:
        description: Upload release build to Play Store / App Store Connect
        required: false
        default: false
        type: boolean

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and typecheck
        run: npm run test:ci:static

      - name: Validate fake server harness
        run: npm run test:fake-server:self

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run CI flow suite against fake OpenCode server
        run: npm run test:e2e:web
        env:
          CI: 'true'
          EXPO_PUBLIC_E2E_MODE: '1'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          retention-days: 3
          path: playwright-report
          if-no-files-found: ignore

  android-release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.target == 'android-release')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      EXPO_APP_VARIANT: production
      EXPO_ANDROID_PACKAGE: ${{ vars.EXPO_ANDROID_PACKAGE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/gradle-wrapper.properties','**/build.gradle*','**/settings.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm ci

      - name: Decode keystore & verify
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -eo pipefail
          # Compute secret length robustly and without adding newlines
          SECRET_LEN=$(printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | wc -c)
          echo "Secret length: $SECRET_LEN"
          if [ "$SECRET_LEN" -lt 100 ]; then
            echo "Keystore secret is unexpectedly short; refusing to continue."
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          # Decode safely using printf to avoid echo interpretation issues
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE_PATH"
          FILE_SIZE=$(stat -c%s "$KEYSTORE_PATH")
          echo "Decoded size: $FILE_SIZE"
          if [ "$FILE_SIZE" -lt 100 ]; then
            echo "Decoded keystore is unexpectedly small; refusing to continue."
            exit 1
          fi
          echo "Keystore on disk:"
          sha256sum "$KEYSTORE_PATH" || true
          ls -l "$KEYSTORE_PATH" || true
        shell: bash

      - name: Build Android release
        run: npm run build:android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-artifacts
          retention-days: 3
          path: android/app/build/outputs/**/*.apk

      - name: Rename APK for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp android/app/build/outputs/apk/release/app-release.apk opencode-mobile.apk

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: opencode-mobile.apk

      - name: Upload to Play Store (internal)
        if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.upload_to_store) }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ vars.EXPO_ANDROID_PACKAGE }}
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

  ios-release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.target == 'ios-release')
    needs: validate
    runs-on: macos-26
    permissions:
      contents: write

    env:
      EXPO_APP_VARIANT: production
      IOS_BUNDLE_IDENTIFIER: app.getopencode.mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          APP_VERSION=$(npx expo config --type public --json | python3 -c "import sys,json; print(json.load(sys.stdin)['version'])")
          if [ "$APP_VERSION" != "${GITHUB_REF_NAME#v}" ]; then
            echo "Tag $GITHUB_REF_NAME does not match app version $APP_VERSION"
            exit 1
          fi

      - name: Validate signing secrets
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          : "${APPLE_CERTIFICATE_BASE64:?Missing required secret: APPLE_CERTIFICATE_BASE64}"
          : "${APPLE_CERTIFICATE_PASSWORD:?Missing required secret: APPLE_CERTIFICATE_PASSWORD}"
          : "${APPLE_PROVISIONING_PROFILE_BASE64:?Missing required secret: APPLE_PROVISIONING_PROFILE_BASE64}"
          : "${APPLE_TEAM_ID:?Missing required secret: APPLE_TEAM_ID}"

      - name: Generate iOS native project
        run: CI=1 npx expo prebuild --platform ios --clean

      - name: Detect workspace
        id: workspace
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" -print -quit)
          if [ -z "$WORKSPACE" ]; then
            echo "No .xcworkspace found"
            exit 1
          fi
          echo "path=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$WORKSPACE" .xcworkspace)" >> "$GITHUB_OUTPUT"

      - name: Create temporary keychain
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

      - name: Import distribution certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | tr -d '[:space:]' | base64 -D > "$CERT_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          PROFILE_PLIST=$RUNNER_TEMP/profile.plist
          printf '%s' "$APPLE_PROVISIONING_PROFILE_BASE64" | tr -d '[:space:]' | base64 -D > "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(plutil -extract UUID raw "$PROFILE_PLIST")
          PROFILE_NAME=$(plutil -extract Name raw "$PROFILE_PLIST")
          PROFILE_TEAM_ID=$(plutil -extract TeamIdentifier.0 raw "$PROFILE_PLIST")
          PROFILE_APP_IDENTIFIER=$(plutil -extract Entitlements.application-identifier raw "$PROFILE_PLIST")
          if [ "$PROFILE_TEAM_ID" != "$APPLE_TEAM_ID" ] || [ "${PROFILE_APP_IDENTIFIER#*.}" != "$IOS_BUNDLE_IDENTIFIER" ]; then
            echo "Provisioning profile does not match team $APPLE_TEAM_ID and bundle $IOS_BUNDLE_IDENTIFIER"
            exit 1
          fi
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID".mobileprovision
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Build archive
        run: |
          xcodebuild -workspace "${{ steps.workspace.outputs.path }}" \
            -scheme "${{ steps.workspace.outputs.name }}" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/build.xcarchive" \
            -destination "generic/platform=iOS" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}.${{ github.run_attempt }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            archive

      - name: Verify archive
        run: |
          if [ ! -d "$RUNNER_TEMP/build.xcarchive" ]; then
            echo "Archive not found"
            exit 1
          fi

      - name: Export IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$IOS_BUNDLE_IDENTIFIER</key>
              <string>$PROFILE_NAME</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/build.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/ios-build"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-ipa
          retention-days: 3
          path: ${{ runner.temp }}/ios-build/*.ipa
          if-no-files-found: error

      - name: Rename IPA for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp "$RUNNER_TEMP/ios-build/"*.ipa opencode-mobile.ipa

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: opencode-mobile.ipa

      - name: Upload to App Store Connect
        if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.upload_to_store) }}
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          if [ -z "$APPSTORE_API_KEY_ID" ] || [ -z "$APPSTORE_API_ISSUER_ID" ] || [ -z "$APPSTORE_API_PRIVATE_KEY" ]; then
            echo "Missing App Store Connect API key secret"
            exit 1
          fi
          IPA_FILE=$(find "$RUNNER_TEMP/ios-build" -name "*.ipa" | head -1)
          if [ -z "$IPA_FILE" ]; then
            echo "No IPA file found"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/private_keys"
          cat > "$RUNNER_TEMP/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8" << EOF
          $APPSTORE_API_PRIVATE_KEY
          EOF
          chmod 600 "$RUNNER_TEMP/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8"

          cd "$RUNNER_TEMP"
          xcrun altool --upload-app \
              --type ios \
              --file "$IPA_FILE" \
              --apiKey "$APPSTORE_API_KEY_ID" \
              --apiIssuer "$APPSTORE_API_ISSUER_ID"

      - name: Cleanup keychain
        if: always()
        run: |
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi

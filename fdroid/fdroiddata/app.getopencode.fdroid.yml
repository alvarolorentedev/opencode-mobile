Builds:
  - versionName: 1.0.52
    versionCode: 52
    commit: 2115b576b1eb9453c22e08f9482a45750757cb8d
    sudo:
      - apt-get update
      - apt-get install -y npm curl
    init:
      - npm ci
      - rm -rf node_modules/expo-dev-client node_modules/expo-dev-launcher node_modules/expo-dev-menu
        node_modules/expo-dev-menu-interface
    output: android/app/build/outputs/apk/release/*.apk
    srclibs:
      - firebase-stub@ce90a956aacda17a85c60577ee443aeb83d876ef
    prebuild:
      - FIREBASE_STUB_SRC_DIR=$$firebase-stub$$/firebase-messaging/src node scripts/foss-prepare.mjs
      - npm pkg set 'expo.autolinking.android.buildFromSource[0]=.*'
      - find node_modules -type f \( -name "*.gradle" -o -name "*.gradle.kts" -o -name
        "*.kt" \) -exec sed -i -e 's/JavaVersion.VERSION_17/JavaVersion.VERSION_21/g'
        -e 's/jvmToolchain(17)/jvmToolchain(21)/g' -e 's/JvmTarget.fromTarget("17")/JvmTarget.fromTarget("21")/g'
        {} +
      - env CI=1 EXPO_APP_VARIANT=foss EXPO_PUBLIC_FOSS=1 npx expo prebuild -p android
        --clean
    scanignore:
      - node_modules/*/local-maven-repo
      - node_modules/@*/*/local-maven-repo
      - node_modules/hermes-compiler/hermesc/linux64-bin/hermesc
    scandelete:
      - node_modules
    build:
      - cd android/app
      - sed -i -e '/signingConfig /d' build.gradle
      - gradle assembleRelease -PreactNativeArchitectures=arm64-v8a
    ndk: 27.1.12297006

AllowedAPKSigningKeys: d5a75b79abebf37d3011c66b681c7b903d99230f9d7f79eddb71ef30fffc3cc5

MaintainerNotes: |-
  Builds the de-Googled FOSS flavor only (package app.getopencode.fdroid). The
  Play/iOS flavor (app.getopencode) is not built here. There is no committed
  android/ directory, so the recipe must not use subdir; prebuild generates it
  and the build runs gradle manually. scripts/foss-prepare.mjs excludes Play
  Billing (expo-iap) and ML Kit barcode scanning (expo-camera) from autolinking,
  swaps firebase-messaging in expo-notifications for the firebase-stub srclib,
  and removes expo-application's install-referrer dependency. The dev-client
  modules are removed because they are development-only and reference Gradle
  projects that are not autolinked for release. Expo modules are forced to
  build from source via expo.autolinking.android.buildFromSource, and the
  local-maven-repo prebuilts stay scanignored so the scan is quiet. The JVM
  toolchain is raised to 21 because the F-Droid buildserver ships only
  OpenJDK 21.
  Reproducible builds are not yet set up (no Binaries); revisit once upstream
  builds with the same JDK 21 toolchain. Voice input uses the device's system
  speech recognizer, which some reviewers may consider a non-free network
  service; if so, add NonFreeNet under AntiFeatures rather than dropping voice.
  If expo-notifications' stub API changes, update the firebase-stub commit here
  and FIREBASE_STUB_SHA in scripts/foss-prepare.mjs together.

